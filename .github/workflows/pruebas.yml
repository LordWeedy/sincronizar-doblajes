# Pruebas de Sync Master en los equipos Windows de GitHub, para no cargar el del autor.
# Solo lo que no necesita vídeos:
#   - las pruebas sueltas del sincronizador (src/probar_sincronizador.py --sin-videos);
#   - la batería del actualizador (herramientas/probar_actualizador.py).
# Los casos fabricados con vídeos y los casos reales se siguen pasando en el equipo del autor (los vídeos no se
# reparten). El entorno es el mismo que el suyo: Python 3.12.1, los paquetes con los que pasa cada batería y su misma
# compilación de ffmpeg (comprobada con su SHA-256).
# Con el evento pull_request (no pull_request_target): el código de un PR corre sin secretos y con permiso de solo
# lectura.
name: Pruebas

on:
  push:
    paths: ["src/**", "herramientas/**", ".github/workflows/pruebas.yml"]
  pull_request:
    paths: ["src/**", "herramientas/**", ".github/workflows/pruebas.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  FFMPEG_TAG: 2026-10-08-git-ec420ba161
  FFMPEG_SHA256: f56272883fb5ceca292da4429551e2fb5036ace74c01cd56ba6a3cbef3808a8d

jobs:
  sueltas:
    name: Sincronizador, pruebas sueltas (sin vídeos)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.1"

      - name: Paquetes (los del Python con el que el autor pasa esta batería)
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.15.1

      - name: ffmpeg (caché)
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ffmpeg-bin
          key: ffmpeg-${{ env.FFMPEG_TAG }}

      - name: ffmpeg (descarga comprobada)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = "ffmpeg-$env:FFMPEG_TAG-full_build.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_TAG/$zip" -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FFMPEG_SHA256) { throw "ffmpeg: el SHA-256 no coincide ($h)" }
          Expand-Archive $zip -DestinationPath ffmpeg-zip
          New-Item -ItemType Directory ffmpeg-bin | Out-Null
          Copy-Item ffmpeg-zip/*/bin/* ffmpeg-bin/
          Remove-Item -Recurse -Force ffmpeg-zip, $zip

      - name: ffmpeg al PATH
        shell: pwsh
        run: |
          "$PWD\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$PWD\ffmpeg-bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Pruebas sueltas
        run: python -B -u src/probar_sincronizador.py --sin-videos

  actualizador:
    name: Batería del actualizador
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.1"

      - name: Paquetes (los del entorno .venv con el que el autor pasa esta batería)
        run: python -m pip install --disable-pip-version-check numpy==2.5.3 scipy==1.18.1 tkinterdnd2==0.6.3

      - name: ffmpeg (caché)
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ffmpeg-bin
          key: ffmpeg-${{ env.FFMPEG_TAG }}

      - name: ffmpeg (descarga comprobada)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = "ffmpeg-$env:FFMPEG_TAG-full_build.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_TAG/$zip" -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FFMPEG_SHA256) { throw "ffmpeg: el SHA-256 no coincide ($h)" }
          Expand-Archive $zip -DestinationPath ffmpeg-zip
          New-Item -ItemType Directory ffmpeg-bin | Out-Null
          Copy-Item ffmpeg-zip/*/bin/* ffmpeg-bin/
          Remove-Item -Recurse -Force ffmpeg-zip, $zip

      - name: ffmpeg al PATH
        shell: pwsh
        run: |
          "$PWD\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # (las versiones de antes que usa la prueba del paso desde las copias por fecha salen de versiones/ del
      # repositorio; openssl, el de Git para Windows del propio equipo de GitHub)
      - name: Batería del actualizador
        run: python -B -u herramientas/probar_actualizador.py
